# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build all platforms

# 全平台编译: Windows / Linux / macOS / Android / iOS
# 手动触发, 各平台产物分别上传 artifact (未签名)。
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.35.3
  GIST_ID: 3fc0adf7ac60b351a9432e9f8ed4e9d3
  LINUX_DEPENDENCIES: git wget unzip python3 zip xz-utils curl clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev cmake-data libjsoncpp25 libsecret-1-dev libsecret-1-0 librhash0 libsqlite3-dev libappindicator3-dev gettext libwebkit2gtk-4.1-dev libasound2-dev libmpv-dev mpv

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
        shell: bash
      - name: Install deps & generate code
        run: |
          ./script/fetch_git_info.ps1
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
        shell: pwsh
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
      - name: Add Windows manifest
        run: |
          $dest = "build\windows\x64\runner\Release\"
          cp windows\runner\resources\app_icon.ico $dest\app.ico
        shell: pwsh
      - name: Archive
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: catmovie-windows.zip
          directory: build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-windows
          path: build/windows/x64/runner/Release/catmovie-windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Install Linux dependencies
        run: sudo apt update && sudo apt-get install -y ${{ env.LINUX_DEPENDENCIES }} || true
      - name: Build linux
        run: |
          bash script/fetch_git_info.sh
          flutter config --enable-linux-desktop
          flutter build linux --release
      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../catmovie-linux-x86_64.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-linux
          path: build/linux/x64/release/catmovie-linux-x86_64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Install deps & generate code
        run: |
          bash script/fetch_git_info.sh
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build APK
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk catmovie.apk
          cp build/app/outputs/flutter-apk/app-release.apk catmovie-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk catmovie-legacy.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk catmovie-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-android
          path: |
            catmovie.apk
            catmovie-universal.apk
            catmovie-legacy.apk
            catmovie-x86_64.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          channel: stable
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Generate git_info.dart
        run: bash script/fetch_git_info.sh
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Pack IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r catmovie.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-ios
          path: build/ios/iphoneos/catmovie.ipa

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          channel: stable
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Generate git_info.dart
        run: bash script/fetch_git_info.sh
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
      - name: Archive macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -ry catmovie-mac.zip 小猫影视.app/*
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-macos
          path: build/macos/Build/Products/Release/catmovie-mac.zip
