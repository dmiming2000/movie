# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build all platforms

# 全平台编译: Windows / Linux / macOS / Android / iOS
# 手动触发, 各平台产物编译完成后自动创建 GitHub Release, 提供公开下载。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (留空则自动用 v<pubspec版本>-<短sha>)，如 2.5.1 / v2.5.1 / release-v2.5.1"
        required: false
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.3
  GIST_ID: 3fc0adf7ac60b351a9432e9f8ed4e9d3
  LINUX_DEPENDENCIES: git wget unzip python3 zip xz-utils curl clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev cmake-data libjsoncpp25 libsecret-1-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev gettext libwebkit2gtk-4.1-dev libasound2-dev libmpv-dev mpv

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version & tag
        id: meta
        run: |
          set -e
          PUBSPEC_VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VER="${INPUT_VER#release-v}"
            VER="${VER#v}"
          else
            SHA=$(git rev-parse --short=7 HEAD)
            VER="${PUBSPEC_VER}-${SHA}"
          fi
          TAG="release-v${VER}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Will release version=$VER tag=$TAG"

  build-windows:
    runs-on: windows-2022
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
        shell: bash
      - name: Install deps & generate code
        run: |
          ./script/fetch_git_info.ps1
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
        shell: pwsh
      - name: Inject version
        run: dart run script/replace_version.dart
        env:
          version: ${{ needs.prepare.outputs.version }}
        shell: pwsh
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
      - name: Add Windows manifest
        run: |
          $dest = "build\windows\x64\runner\Release\"
          cp windows\runner\resources\app_icon.ico $dest\app.ico
        shell: pwsh
      - name: Archive
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: catmovie-windows.zip
          directory: build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-windows
          path: build/windows/x64/runner/Release/catmovie-windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Inject version
        run: dart run script/replace_version.dart
        env:
          version: ${{ needs.prepare.outputs.version }}
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Install Linux dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ${{ env.LINUX_DEPENDENCIES }}
      - name: Build linux
        run: |
          bash script/fetch_git_info.sh
          flutter config --enable-linux-desktop
          flutter build linux --release
      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../catmovie-linux-x86_64.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-linux
          path: build/linux/x64/release/catmovie-linux-x86_64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Install deps & generate code
        run: |
          bash script/fetch_git_info.sh
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Inject version
        run: dart run script/replace_version.dart
        env:
          version: ${{ needs.prepare.outputs.version }}
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build APK
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk catmovie.apk
          cp build/app/outputs/flutter-apk/app-release.apk catmovie-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk catmovie-legacy.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk catmovie-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-android
          path: |
            catmovie.apk
            catmovie-universal.apk
            catmovie-legacy.apk
            catmovie-x86_64.apk

  build-ios:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          channel: stable
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Generate git_info.dart
        run: bash script/fetch_git_info.sh
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Inject version
        run: dart run script/replace_version.dart
        env:
          version: ${{ needs.prepare.outputs.version }}
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Pack IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r catmovie.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-ios
          path: build/ios/iphoneos/catmovie.ipa

  build-macos:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          channel: stable
      - name: Download kitty.umd.js
        run: |
          mkdir -p packages/xi/assets/js
          curl -L -o packages/xi/assets/js/kitty.umd.js "https://gist.githubusercontent.com/d1y/${{ env.GIST_ID }}/raw/kitty.umd.js"
      - name: Generate git_info.dart
        run: bash script/fetch_git_info.sh
      - name: Install deps & generate code
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Inject version
        run: dart run script/replace_version.dart
        env:
          version: ${{ needs.prepare.outputs.version }}
      - name: Generate templates
        run: |
          cd JS/cli
          bun install
          cd ../../packages/xi/lib/adapters/templates
          bun install
          bun run build
      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
      - name: Archive macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -ry catmovie-mac.zip 小猫影视.app/*
      - uses: actions/upload-artifact@v4
        with:
          name: catmovie-macos
          path: build/macos/Build/Products/Release/catmovie-mac.zip

  release:
    needs: [prepare, build-windows, build-linux, build-android, build-ios, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: List assets
        run: find assets -type f | sort

      - name: Generate release body
        run: |
          set -e
          TAG="${{ needs.prepare.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          mklinks() {
            local f="$1"
            local raw="${BASE}/${f}"
            printf '%s' "[原始](${raw}) \| [全球加速](https://gh-proxy.com/${raw}) \| [香港加速](https://hk.gh-proxy.com/${raw}) \| [加速3](https://ghfast.top/${raw})"
          }

          {
            echo "## 🐱 小猫影视(${DATE})"
            echo ""
            echo "| 系统 | 文件 | 架构 | 下载链接 |"
            echo "|---|---|---|---|"
            echo "| Windows | catmovie-windows.zip | x64 | $(mklinks catmovie-windows.zip) |"
            echo "| Linux | catmovie-linux-x86_64.tar.gz | x86_64 | $(mklinks catmovie-linux-x86_64.tar.gz) |"
            echo "| macOS | catmovie-mac.zip | universal | $(mklinks catmovie-mac.zip) |"
            echo "| iOS | catmovie.ipa | - | $(mklinks catmovie.ipa) |"
            echo "| Android | catmovie.apk | arm64-v8a | $(mklinks catmovie.apk) |"
            echo "| Android | catmovie-universal.apk | universal | $(mklinks catmovie-universal.apk) |"
            echo "| Android | catmovie-legacy.apk | armeabi-v7a | $(mklinks catmovie-legacy.apk) |"
            echo "| Android | catmovie-x86_64.apk | x86_64 | $(mklinks catmovie-x86_64.apk) |"
            echo ""
            echo "## ℹ️ 安装说明"
            echo ""
            echo "- **iOS**：IPA 未签名，需自签或用 TrollStore 安装"
            echo "- **macOS**：首次打开若提示无法验证，右键 -> 打开"
            echo "- **Android**：优先下载 \`catmovie.apk\`（arm64）；老设备选 \`catmovie-legacy.apk\`"
            echo "- **国内用户**：建议使用加速链接下载，速度更快"
          } > body.md

          echo "=== body.md ==="
          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.tag_name }}
          body_path: body.md
          generate_release_notes: true
          prerelease: false
          files: |
            assets/catmovie-windows/catmovie-windows.zip
            assets/catmovie-linux/catmovie-linux-x86_64.tar.gz
            assets/catmovie-android/catmovie.apk
            assets/catmovie-android/catmovie-universal.apk
            assets/catmovie-android/catmovie-legacy.apk
            assets/catmovie-android/catmovie-x86_64.apk
            assets/catmovie-ios/catmovie.ipa
            assets/catmovie-macos/catmovie-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
